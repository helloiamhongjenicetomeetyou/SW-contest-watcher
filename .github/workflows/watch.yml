name: UOU Scholarship Watcher

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: uou-scholarship-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python watcher.py

      # 이 작업이 도는 동안 다른 실행이나 사람이 먼저 푸시하면 푸시가 거절된다.
      # 그때는 원격 state와 이번 state를 합쳐서 원격 위에 새로 올린다.
      # 합치지 않고 덮어쓰면 이미 보낸 글이 되살아나 메일이 두 번 간다.
      - name: Commit updated state
        run: |
          git config user.name "uou-scholarship-watcher-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main

            python scripts/merge_state.py "$RUNNER_TEMP/seen.json"
            git reset --quiet --hard origin/main
            mkdir -p state
            mv "$RUNNER_TEMP/seen.json" state/seen.json

            git add state/seen.json
            if git diff --cached --quiet; then
              echo "state에 바뀐 게 없습니다."
              exit 0
            fi

            git commit --quiet -m "chore: update seen scholarship notices"
            if git push --quiet origin HEAD:main; then
              echo "state 커밋 완료."
              exit 0
            fi

            echo "누가 먼저 푸시했습니다. 다시 시도합니다. ($attempt/3)"
            sleep 5
          done

          echo "state를 커밋하지 못했습니다."
          exit 1
